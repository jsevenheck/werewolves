services:
  app:
    # Image is built and pushed to GHCR by the CI workflow, tagged with the
    # commit SHA. The deploy workflow injects IMAGE_TAG=<sha> so the VPS pulls
    # that exact, immutable image instead of rebuilding from source. Falls back
    # to :latest if IMAGE_TAG is unset (e.g. a manual `docker compose pull`).
    image: ghcr.io/jsevenheck/werewolves:${IMAGE_TAG:-latest}
    restart: unless-stopped
    expose:
      - '3001'
    environment:
      - NODE_ENV=production
      # Admin token for the global admin console (?admin=1). Substituted from
      # the host environment: set via the deploy workflow's GitHub Secret, or
      # via a .env file next to this compose file on the VPS. Empty/unset =
      # admin endpoints disabled (no crash, just no admin access).
      - WEREWOLVES_ADMIN_TOKEN=${WEREWOLVES_ADMIN_TOKEN:-}
    labels:
      - traefik.enable=true

      - traefik.http.routers.${COMPOSE_PROJECT_NAME}.rule=Host(`${COMPOSE_PROJECT_NAME}.${TRAEFIK_HOST}`)
      - traefik.http.routers.${COMPOSE_PROJECT_NAME}.entrypoints=websecure
      - traefik.http.routers.${COMPOSE_PROJECT_NAME}.tls.certresolver=letsencrypt

      - traefik.http.services.${COMPOSE_PROJECT_NAME}.loadbalancer.server.port=3001
