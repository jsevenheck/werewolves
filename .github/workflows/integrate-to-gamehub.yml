name: Integrate to Game Hub

on:
  push:
    branches:
      - main
      - pre-main-vue
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Type check
        run: pnpm typecheck
      - name: Run unit tests
        run: pnpm test
      - name: Install Playwright
        run: pnpm exec playwright install --with-deps chromium
      - name: Run E2E tests
        run: pnpm test:e2e

  integrate:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout game repo
        uses: actions/checkout@v4
        with:
          path: game-repo

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Transform game structure
        run: |
          cd game-repo
          node scripts/transform-for-gamehub.js

      - name: Checkout Game Hub
        uses: actions/checkout@v4
        with:
          repository: jsevenheck/game-hub
          path: game-hub
          token: ${{ secrets.GAMEHUB_PAT }}

      - name: Copy transformed game
        run: |
          rm -rf game-hub/games/werewolves
          cp -r game-repo/game-export/werewolves game-hub/games/

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GAMEHUB_PAT }}
          path: game-hub
          commit-message: "feat(games): update werewolves from ${{ github.sha }}"
          branch: integrate/werewolves-${{ github.run_number }}
          delete-branch: true
          title: "Update Werewolves Game"
          body: |
            ## Werewolves Game Update
            
            **Source Commit**: ${{ github.repository }}@${{ github.sha }}
            **Triggered by**: @${{ github.actor }}
            **Run**: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            
            ### Changes
            - Automatic integration from werewolves repository
            - All tests passed in source repo
            
            ### Review Checklist
            - [ ] Game structure follows conventions
            - [ ] No breaking changes to platform contracts
            - [ ] Game registry updated if needed
            - [ ] E2E tests pass in Game Hub
