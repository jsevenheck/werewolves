name: Integrate to Game Hub

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

# Prevent concurrent runs on the same branch
concurrency:
  group: gamehub-integration-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test-and-integrate:
    name: Test & Create Game Hub PR
    runs-on: ubuntu-latest
    env:
      SOURCE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      SOURCE_BRANCH: ${{ github.event.workflow_run.head_branch || github.ref_name }}
      SOURCE_MESSAGE: ${{ github.event.workflow_run.head_commit.message || github.event.head_commit.message || '' }}
      SOURCE_AUTHOR_NAME: ${{ github.event.workflow_run.head_commit.author.name || github.actor }}
      SOURCE_AUTHOR_EMAIL: ${{ github.event.workflow_run.head_commit.author.email || '' }}
      SOURCE_TIMESTAMP: ${{ github.event.workflow_run.head_commit.timestamp || '' }}
    
    # Run after successful CI, or when manually dispatched.
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    
    steps:
      - name: Checkout Werewolves Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Transform for Game Hub
        run: node scripts/transform-for-gamehub.js

      - name: Verify Export Structure
        run: |
          echo "Verifying game-export structure..."
          if [ ! -d "game-export/werewolves" ]; then
            echo "❌ game-export/werewolves directory not found"
            exit 1
          fi
          
          if [ ! -f "game-export/werewolves/README.md" ]; then
            echo "❌ README.md not found"
            exit 1
          fi
          
          if [ ! -d "game-export/werewolves/web/src" ]; then
            echo "❌ web/src directory not found"
            exit 1
          fi
          
          if [ ! -d "game-export/werewolves/server/src" ]; then
            echo "❌ server/src directory not found"
            exit 1
          fi
          
          if [ ! -d "game-export/werewolves/shared/src" ]; then
            echo "❌ shared/src directory not found"
            exit 1
          fi
          
          echo "✅ Export structure verified"

      - name: Checkout Game Hub Repository
        uses: actions/checkout@v4
        with:
          repository: jsevenheck/game-hub
          # GAMEHUB_PAT is a manually configured repository secret
          token: ${{ secrets.GAMEHUB_PAT }}
          path: game-hub
          fetch-depth: 0

      - name: Copy Transformed Game to Game Hub
        run: |
          echo "Copying werewolves game to game-hub/games/..."
          rm -rf game-hub/games/werewolves
          mkdir -p game-hub/games
          cp -r game-export/werewolves game-hub/games/
          echo "✅ Copy complete"

      - name: Create Pull Request to Game Hub
        uses: peter-evans/create-pull-request@v7
        with:
          # GAMEHUB_PAT is a manually configured repository secret
          token: ${{ secrets.GAMEHUB_PAT }}
          path: game-hub
          commit-message: |
            🐺 Update Werewolves Game
            
            Auto-generated from werewolves repo
            Source commit: ${{ env.SOURCE_SHA }}
          branch: update-werewolves-game
          delete-branch: true
          title: '🐺 Update Werewolves Game'
          body: |
            ## Werewolves Game Update
            
            This PR updates the Werewolves game with the latest changes from the standalone repository.
            
            ### Source Information
            - **Repository:** ${{ github.repository }}
            - **Branch:** ${{ env.SOURCE_BRANCH }}
            - **Commit:** ${{ env.SOURCE_SHA }}
            - **Commit Message:** ${{ env.SOURCE_MESSAGE }}
            - **Author:** ${{ env.SOURCE_AUTHOR_NAME }} <${{ env.SOURCE_AUTHOR_EMAIL }}>
            - **Timestamp:** ${{ env.SOURCE_TIMESTAMP }}
            
            ### Tests Status
            ✅ All tests passed in source repository:
            - Type checking
            - Unit tests
            - E2E tests
            
            ### Integration Notes
            ⚠️ **Manual adaptation required** - This is a template export that needs integration work:
            - [ ] Review and adapt `web/src/Werewolves.vue` for `sessionId`, `joinToken`, `wsNamespace`
            - [ ] Decide how to map `sessionId` to the game's room-code flow
            - [ ] Ensure `registerWerewolf(io)` is mounted under `/g/werewolves`
            - [ ] Test in Game Hub environment
            - [ ] Update integration checklist in `games/werewolves/README.md`
            
            See `games/werewolves/README.md` for the complete integration checklist.
            
            ---
            *This PR was automatically generated by the Werewolves CI/CD workflow.*
          labels: |
            game-update
            werewolves
            automated-pr
          reviewers: jsevenheck

      - name: Summary
        if: success()
        run: |
          echo "✅ Integration workflow completed successfully!"
          echo ""
          echo "📦 Transformed Werewolves game and created PR in Game Hub"
          echo "🔗 Source commit: ${{ env.SOURCE_SHA }}"
          echo "🌿 Branch: ${{ env.SOURCE_BRANCH }}"

      - name: Upload Export Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: werewolves-game-export-${{ env.SOURCE_SHA }}
          path: game-export/
          retention-days: 7
