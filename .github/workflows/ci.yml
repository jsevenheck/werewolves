name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.2

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: |
          pnpm install
          pnpm -C ui-vue install
          pnpm -C standalone-server install
          pnpm -C standalone-web install

      - name: Typecheck
        run: pnpm run typecheck

      - name: Typecheck standalone wrappers
        run: |
          cd standalone-server && npx tsc --noEmit
          cd ../standalone-web && pnpm exec vue-tsc --noEmit

      - name: Build
        run: pnpm run build

      - name: Build standalone-web
        run: pnpm -C standalone-web build

      - name: Unit tests
        run: pnpm test

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps

      - name: E2E tests
        run: pnpm run test:e2e
